<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="global.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablet VI</title>
    <style>
        html,
        body {
            height: 100vh;
            margin: 0;
            background-color: #222;
            background-image: url('images/EVENBETTR.avif');
            background-repeat: no-repeat;
            background-position: center;
            background-position-x: 55%;
            background-position-y: center;
            color: #fff;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 2.5vw;
            background-size: 170%;
        }

        /* Static overlay that matches the image's native placement/size and doesn't resize */
        #finalsplash {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 64vw;
            margin: auto;
        }

        .splash-line {
            opacity: 0;
            transform: translateY(18px);
            transition: opacity 900ms ease, transform 900ms ease;
            display: block;
        }

        .splash-line.show {
            opacity: 1;
            transform: translateY(0);
        }

        .splash-line.up {
            transform: translateY(-28px);
            transition: transform 300ms ease;
        }

        .splash-credit {
            display: block;
            margin-top: 10px;
            font-size: 18px;
            color: #ffd7b2
        }


        .nav-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 30px;
            background-color: rgba(20, 20, 20, 0.7);
            color: rgba(255, 180, 120, 0.8);
            text-decoration: none;
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: bold;
            font-size: 28px;
            border: 2px solid rgba(0, 0, 0, 0.8);
            border-top-color: rgba(255, 180, 120, 0.4);
            border-left-color: rgba(255, 180, 120, 0.4);
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.8);
            z-index: 100;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
            display: none;
        }

        .nav-btn.active {
            display: block;
            animation: pulseGlow 1.5s infinite;
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 0 10px rgba(255, 180, 120, 0.6), 4px 4px 10px rgba(0, 0, 0, 0.8);
                border-color: rgba(255, 180, 120, 0.6);
            }

            50% {
                box-shadow: 0 0 30px rgba(255, 200, 150, 1), 4px 4px 15px rgba(0, 0, 0, 0.9);
                border-color: rgba(255, 200, 150, 1);
            }

            100% {
                box-shadow: 0 0 10px rgba(255, 180, 120, 0.6), 4px 4px 10px rgba(0, 0, 0, 0.8);
                border-color: rgba(255, 180, 120, 0.6);
            }
        }

        .nav-btn:hover {
            background-color: rgba(40, 30, 20, 0.9);
            color: rgba(255, 220, 180, 1);
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 200, 150, 1);
        }
    </style>

</head>

<body>
    <div class="splash-text" id="finalsplash">
        <div>
            <div class="splash-line">Welcome to the modern age — where technology is readily available and easy to
                use.</div>
            <div class="splash-line">Who knows what amazing innovations will come next.</div>
            <div class="splash-line">Thanks for playing.</div>
            <div class="splash-line splash-credit">Made by Elliot Broweleit</div>
        </div>
    </div>

    <script>
        // Sequential splash lines: fade in each line, and lift previous lines to make room
        (function () {
            const splash = document.getElementById('finalsplash');
            if (!splash) return;
            const lines = Array.from(splash.querySelectorAll('.splash-line'));
            const baseDelay = 700;
            const gap = 1600;
            lines.forEach((el, i) => {
                setTimeout(() => {
                    el.classList.add('show');
                    if (i > 0) {
                        for (let j = 0; j < i; j++) lines[j].classList.add('up');
                    }
                }, baseDelay + i * gap);
            });
        })();
    </script>
</body>

</html>
