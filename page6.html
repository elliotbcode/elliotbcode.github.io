<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="global.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablet VI</title>
    <style>
        html,body{height:100%;margin:0;background:#000;color:#fff;-webkit-text-size-adjust:100%;text-size-adjust:100%}
        .final-screen{position:fixed;left:0;top:0;width:100%;height:100%;background:#000;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column}
        .final-screen img{max-width:100%;max-height:80%;object-fit:contain;display:block}
        .final-message{color:#fff;font-family:'Papyrus',cursive;font-size:32px;text-align:center;margin-top:20px;}
        .container{position:relative;z-index:1}
        #whisper-text{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.85);font-family:'Papyrus',cursive;font-size:34px;text-align:center;z-index:90;pointer-events:none;text-shadow:1px 1px 4px rgba(0,0,0,0.9);transition:opacity 1.5s ease-in-out;opacity:1;width:80%}
        .nav-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 30px;
            background-color: rgba(20, 20, 20, 0.7);
            color: rgba(255, 180, 120, 0.8);
            text-decoration: none;
            font-family: 'Papyrus', cursive;
            font-weight: bold;
            font-size: 28px;
            border: 2px solid rgba(0, 0, 0, 0.8);
            border-top-color: rgba(255, 180, 120, 0.4);
            border-left-color: rgba(255, 180, 120, 0.4);
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.8);
            z-index: 100;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.9);
            display: none;
        }
        .nav-btn.active {
            display: block;
            animation: pulseGlow 1.5s infinite;
        }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 10px rgba(255, 180, 120, 0.6), 4px 4px 10px rgba(0,0,0,0.8); border-color: rgba(255, 180, 120, 0.6); }
            50% { box-shadow: 0 0 30px rgba(255, 200, 150, 1), 4px 4px 15px rgba(0,0,0,0.9); border-color: rgba(255, 200, 150, 1); }
            100% { box-shadow: 0 0 10px rgba(255, 180, 120, 0.6), 4px 4px 10px rgba(0,0,0,0.8); border-color: rgba(255, 180, 120, 0.6); }
        }
        .nav-btn:hover {
            background-color: rgba(40, 30, 20, 0.9);
            color: rgba(255, 220, 180, 1);
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 200, 150, 1);
        }
    </style>

</head>

<body>
    <div class="final-overlay" id="final-overlay">
        <img src="images/EVEN BETTR.avif" alt="Final image" style="max-width:100%;max-height:80%;object-fit:contain;">
        <div class="final-message">Thanks for playing!<br/>You've completed the monument.</div>
    </div>

    <svg style="width:0;height:0;position:absolute;" aria-hidden="true">
        <filter id="weathered">
            <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="4" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>
    <div class="weathered-text">⟡ ⟠ ⟡</div>
    <div class="container">
        <h1>Tablet VI</h1>
        <p>This is page6.html.</p>
    </div>

    <script>
        const whispers = [
            "One sheep plus two sheep is arithmetic... what number does it equal?",
            "Observe the stone; the equation will guide you."
        ];
        let wIndex = 0;
        const wEl = document.createElement('div');
        wEl.className = 'hint-text';
        wEl.innerText = whispers[wIndex];
        document.body.appendChild(wEl);

        setInterval(() => {
            wEl.style.opacity = 0;
            setTimeout(() => {
                wIndex = (wIndex + 1) % whispers.length;
                wEl.innerText = whispers[wIndex];
                wEl.style.opacity = 1;
            }, 1500);
        }, 6000);

        // Developer bypass
        let devBypass = "";
        window.addEventListener('keydown', (e) => {
            devBypass += e.key;
            if (devBypass.endsWith('OPENSEASAME')) {
                document.querySelector('.nav-btn').classList.add('active');
            }
        });
    </script>
</body>

</html>
